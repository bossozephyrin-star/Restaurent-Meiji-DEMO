<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meiji Sushi & Grill, restaurant japonais à Brazzaville. Découvrez notre menu." />
    <meta name="robots" content="noindex, nofollow" />
    <title>
      Accueil | Meiji Sushi &amp; Grill
    </title>
    <link rel="stylesheet" href="./assets/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
      <link rel="stylesheet" href="./css/refinements.css">
    <script type="module" src="./assets/js/site.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="./index.html#accueil" aria-label="Meiji Sushi &amp; Grill, accueil"><img src="./assets/img/meiji-logo.png" alt="Meiji Sushi &amp; Grill" fetchpriority="high" /></a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a href="./index.html#accueil">Accueil</a><a href="./menu.html">Menu</a><a href="#contact">Contact</a>
      </nav>
    </header>
    <main>
      <section class="hero" id="accueil" aria-labelledby="hero-title">
        <video
          class="hero__video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="./assets/img/hero-sushi-poster.jpg"
          aria-hidden="true"
          tabindex="-1"
        >
          <source src="./assets/video/hero-sushi.mp4" type="video/mp4" />
        </video>
        <div class="hero__shade" aria-hidden="true">
        </div>
        <div class="hero__content">
          <p class="hero__eyebrow" lang="en">
            Japanese Food &amp; Sushi Bar
          </p>
          <h1 id="hero-title">
            <img src="./assets/img/meiji-wordmark.png" alt="Meiji" />
          </h1>
          <p class="hero__subtitle">
            Sushi &amp; Grill
          </p>
          <div class="hero__actions">
            <a class="hero__button hero__button--primary" href="./menu.html">Découvrir notre menu</a><a class="hero__button hero__button--secondary" href="#contact">Nous trouver</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="contact">
      <div class="site-footer__content">
        <p class="contact-eyebrow">Meiji Sushi &amp; Grill</p>
        <h2>Nous trouver</h2>
        <address>Centre ville, vers la Cathédrale Sacré-Cœur<br>Brazzaville</address>
        <a class="contact-phone" href="tel:+242069387668">+242 06 938 76 68</a>
        <div class="contact-actions">
          <a class="contact-button" href="tel:+242069387668">Nous appeler</a>
          <button class="contact-button contact-button--outline" type="button" data-share-menu>Partager le menu</button>
        </div>
        <p class="share-feedback" data-share-feedback role="status"></p>
        <p class="site-footer__notice">Démo non officielle · <a href="./confidentialite.html">Confidentialité</a></p>
      </div>
    </footer>
  </body>
</html>
